<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Geometry Dash Launcher</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #101018;
  font-family: Arial, sans-serif;
}
button {
  padding: 18px 32px;
  background: #5865f2;
  color: white;
  border: 0;
  border-radius: 10px;
  font-size: 20px;
  cursor: pointer;
}
</style>
</head>
<body>
<button onclick="openGame()">Open Geometry Dash</button>
<script>
function openGame() {
  const win = window.open("about:blank", "_blank");
  if (!win) {
    alert("Allow pop-ups, then try again.");
    return;
  }

  const frame = win.document.createElement("iframe");
  frame.src = "https://gd-webport.pages.dev/";
  frame.style.cssText =
    "position:fixed;inset:0;width:100%;height:100%;border:0";
  win.document.body.style.margin = "0";
  win.document.body.appendChild(frame);
}
</script>
</body>
</html>
